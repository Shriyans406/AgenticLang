[project]
name = "mcpdemolangchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shriyans S Sahoo", email = "shriyans.s.sahoo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mcpdemolangchain = "mcpdemolangchain:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
